apiVersion: fleet.harness/v3
kind: Fleet
metadata:
  id: release-readiness
spec:
  objective: リリース候補を出荷できるかを判断する。
  completion_criteria:
    - 宣言したすべてのタスクに、マネージャーが受け入れた証拠がある。
    - マネージャーが、リリースできるかの最終判断を記録している。
  stop_conditions:
    - 取り消せない指示が届いたかどうか分からなくなった。
    - 必要な独立レビューを完了できない。
  members:
    - agent_ref: manager-1
      role_ref: manager@2
      runtime:
        product: claude
        command: claude
        model: your-claude-model-id
        effort: high
        fallback: fail
    - agent_ref: worker-1
      role_ref: worker@2
      runtime:
        product: codex
        command: codex
        model: your-codex-model-id
        effort: medium
        fallback: fail
    - agent_ref: reviewer-1
      role_ref: reviewer@1
      runtime:
        product: claude
        command: claude
        model: your-claude-model-id
        effort: high
        fallback: fail
  tasks:
    - id: verify-candidate
      assignee: worker-1
      depends_on: []
      instructions: リリース前の検査を実行し、失敗したものを再現手順とともに記録する。
      expected_output: 検査結果と、失敗ごとの再現の証拠。
      completion_criteria:
        - 宣言したリリース前の検査のすべてに、結果が記録されている。
    - id: review-evidence
      assignee: reviewer-1
      depends_on:
        - verify-candidate
      instructions: 検査の証拠を作業経緯から独立に反証し、残るリリースのリスクを示す。
      expected_output: 証拠の欠けとリリースのリスクを、再現手順とともに示したレビュー結果。
      completion_criteria:
        - 主張された検査結果のそれぞれが、確認済みか未検証かに分けられている。
    - id: decide-readiness
      assignee: manager-1
      depends_on:
        - review-evidence
      instructions: 検査とレビューの証拠を確かめ、リリースできるかを判断する。
      expected_output: 判断と、その根拠の証拠、残るリスク。
      completion_criteria:
        - 判断が、受け入れた検査の証拠とレビューの証拠を参照している。
  collaboration:
    manager: manager-1
    reporting:
      strategy: manager
      include_task_updates: true
