$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-fleet.local/schema/fleet.schema.yml
title: Agent Fleet specification
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion:
    enum: [fleet.harness/v1, fleet.harness/v2]
  kind:
    const: Fleet
  metadata:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        $ref: "#/$defs/safeIdentifier"
  spec:
    type: object
    additionalProperties: false
    required: [objective, completion_criteria, stop_conditions, members, tasks, collaboration]
    properties:
      objective:
        $ref: "#/$defs/nonEmptyString"
      completion_criteria:
        $ref: "#/$defs/nonEmptyStringList"
      stop_conditions:
        $ref: "#/$defs/nonEmptyStringList"
      members:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/agentInstance"
      tasks:
        type: array
        items:
          $ref: "#/$defs/taskAssignment"
      collaboration:
        $ref: "#/$defs/collaboration"
      runtime:
        $ref: "#/$defs/legacyRuntimeBinding"
      view:
        $ref: "#/$defs/legacyViewPlacement"
allOf:
  - if:
      properties:
        apiVersion:
          const: fleet.harness/v2
      required: [apiVersion]
    then:
      properties:
        spec:
          not:
            anyOf:
              - required: [runtime]
              - required: [view]
$defs:
  nonEmptyString:
    type: string
    minLength: 1
  nonEmptyStringList:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/nonEmptyString"
  safeIdentifier:
    type: string
    pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
  agentRuntime:
    description: The AI product, model, and reasoning effort requested for one member.
    type: object
    additionalProperties: false
    required: [product, model, effort, fallback]
    properties:
      product:
        type: string
        enum: [codex, claude]
      model:
        $ref: "#/$defs/nonEmptyString"
      effort:
        type: string
        enum: [low, medium, high, xhigh, max]
      fallback:
        description: Whether the product may silently switch to another model.
        type: string
        enum: [fail, product-default]
  agentInstance:
    description: A fleet member instance; it is not a reusable RoleDefinition.
    type: object
    additionalProperties: false
    required: [agent_ref, role_ref, runtime]
    properties:
      agent_ref:
        $ref: "#/$defs/safeIdentifier"
      role_ref:
        type: string
        pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*@[1-9][0-9]*$
      runtime:
        $ref: "#/$defs/agentRuntime"
  taskAssignment:
    description: A declarative assignment; it is not task execution state.
    type: object
    additionalProperties: false
    required: [id, assignee, depends_on, instructions, expected_output, completion_criteria]
    properties:
      id:
        $ref: "#/$defs/safeIdentifier"
      assignee:
        $ref: "#/$defs/nonEmptyString"
      depends_on:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/nonEmptyString"
      instructions:
        $ref: "#/$defs/nonEmptyString"
      expected_output:
        $ref: "#/$defs/nonEmptyString"
      completion_criteria:
        $ref: "#/$defs/nonEmptyStringList"
  collaboration:
    type: object
    additionalProperties: false
    required: [manager, reporting]
    properties:
      manager:
        description: Exactly one agent_ref.
        $ref: "#/$defs/nonEmptyString"
      advisor:
        $ref: "#/$defs/nonEmptyString"
      reporting:
        type: object
        additionalProperties: false
        required: [strategy, include_task_updates]
        properties:
          strategy:
            const: manager
          include_task_updates:
            type: boolean
  legacyRuntimeBinding:
    description: Deprecated v1-only Herdr binding. New Fleet v2 documents must use a Herdr LaunchProfile.
    type: object
    additionalProperties: false
    required: [provider]
    properties:
      provider:
        $ref: "#/$defs/nonEmptyString"
      codex_hook_trust:
        type: string
        enum: [preapproved, review]
  legacyViewPlacement:
    description: Deprecated v1-only ViewProfile reference.
    type: object
    additionalProperties: false
    required: [profile_ref]
    properties:
      profile_ref:
        type: string
        pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?@[1-9][0-9]*$
