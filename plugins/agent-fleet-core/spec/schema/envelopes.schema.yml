$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-fleet.local/schema/envelopes.schema.yml
title: Agent Fleet command and event envelopes
oneOf:
  - $ref: "#/$defs/commandEnvelope"
  - $ref: "#/$defs/eventEnvelope"
$defs:
  nonEmptyString:
    type: string
    minLength: 1
  metadata:
    type: object
    additionalProperties: false
    required: [id, fleet_id, timestamp]
    properties:
      id:
        $ref: "#/$defs/nonEmptyString"
      fleet_id:
        $ref: "#/$defs/nonEmptyString"
      timestamp:
        type: string
        format: date-time
      correlation_id:
        $ref: "#/$defs/nonEmptyString"
      causation_id:
        $ref: "#/$defs/nonEmptyString"
  target:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [fleet, member, task, runtime, view]
      ref:
        $ref: "#/$defs/nonEmptyString"
  source:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [fleet, member, task, runtime, view, provider, system]
      ref:
        $ref: "#/$defs/nonEmptyString"
  roleContext:
    description: The complete, revisioned role context for the target member.
    type: object
    additionalProperties: false
    required: [fleet_id, context_revision, agent, fleet, assignments, reporting]
    properties:
      fleet_id:
        $ref: "#/$defs/nonEmptyString"
      context_revision:
        type: integer
        minimum: 1
      agent:
        type: object
        additionalProperties: false
        required: [agent_ref, role_ref]
        properties:
          agent_ref:
            $ref: "#/$defs/nonEmptyString"
          role_ref:
            $ref: "#/$defs/nonEmptyString"
      fleet:
        type: object
        additionalProperties: false
        required: [objective, completion_criteria, stop_conditions]
        properties:
          objective:
            $ref: "#/$defs/nonEmptyString"
          completion_criteria:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/nonEmptyString"
          stop_conditions:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/nonEmptyString"
      assignments:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [task_id, status, instructions, expected_output, completion_criteria]
          properties:
            task_id:
              $ref: "#/$defs/nonEmptyString"
            status:
              $ref: "#/$defs/nonEmptyString"
            instructions:
              $ref: "#/$defs/nonEmptyString"
            expected_output:
              $ref: "#/$defs/nonEmptyString"
            completion_criteria:
              type: array
              minItems: 1
              items:
                $ref: "#/$defs/nonEmptyString"
      reporting:
        type: object
        additionalProperties: false
        required: [manager_ref, strategy, completion_requires_manager_acceptance]
        properties:
          manager_ref:
            $ref: "#/$defs/nonEmptyString"
          strategy:
            const: manager
          completion_requires_manager_acceptance:
            const: true
  commandEnvelope:
    description: A requested action. It contains intent, not execution state.
    type: object
    additionalProperties: false
    required: [apiVersion, kind, metadata, spec]
    properties:
      apiVersion:
        const: fleet.harness/v1
      kind:
        const: Command
      metadata:
        $ref: "#/$defs/metadata"
      spec:
        type: object
        additionalProperties: false
        required: [source, target, type, payload, context]
        properties:
          source:
            $ref: "#/$defs/source"
          target:
            $ref: "#/$defs/target"
          type:
            $ref: "#/$defs/nonEmptyString"
          payload:
            type: object
          context:
            $ref: "#/$defs/roleContext"
  eventEnvelope:
    description: A fact that occurred. Consumers must not interpret it as a command.
    type: object
    additionalProperties: false
    required: [apiVersion, kind, metadata, spec]
    properties:
      apiVersion:
        const: fleet.harness/v1
      kind:
        const: Event
      metadata:
        $ref: "#/$defs/metadata"
      spec:
        type: object
        additionalProperties: false
        required: [source, type, payload]
        properties:
          source:
            $ref: "#/$defs/source"
          type:
            $ref: "#/$defs/nonEmptyString"
          payload:
            type: object
