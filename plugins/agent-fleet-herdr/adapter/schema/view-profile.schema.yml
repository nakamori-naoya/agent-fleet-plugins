$schema: https://json-schema.org/draft/2020-12/schema
$id: https://agent-fleet.local/schema/view-profile.schema.yml
title: Herdr View Profile
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion:
    const: fleet.herdr.harness/v2
  kind:
    const: ViewProfile
  metadata:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id:
        type: string
        pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*(/[a-z][a-z0-9]*(-[a-z0-9]+)*)?$
      version:
        type: integer
        minimum: 1
  spec:
    type: object
    additionalProperties: false
    required: [constraints, layout]
    properties:
      constraints:
        type: object
        additionalProperties: false
        required: [min_members, max_members]
        properties:
          min_members:
            type: integer
            minimum: 1
          max_members:
            type: integer
            minimum: 1
      layout:
        type: object
        additionalProperties: false
        required: [type, direction, children]
        properties:
          type:
            const: split
          direction:
            enum: [horizontal, vertical]
          children:
            type: array
allOf:
  - properties:
      spec:
        properties:
          layout:
            properties:
              children:
                minItems: 2
                maxItems: 8
                items:
                  $ref: "#/$defs/layoutGroup"
$defs:
  identifier:
    type: string
    pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
  positiveWeight:
    type: integer
    minimum: 1
  layoutGroup:
    type: object
    additionalProperties: false
    required: [type, id, selector, weight, direction, distribution]
    properties:
      type:
        const: stack
      id:
        $ref: "#/$defs/identifier"
      selector:
        type: object
        additionalProperties: false
        properties:
          role_ids:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/$defs/identifier"
          agent_refs:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/$defs/identifier"
          remaining:
            const: true
        oneOf:
          - required: [role_ids]
          - required: [agent_refs]
          - required: [remaining]
      weight:
        type: integer
        minimum: 1
      direction:
        enum: [horizontal, vertical]
      distribution:
        const: equal
