apiVersion: fleet.herdr.harness/v1
kind: ViewProfile
metadata:
  id: builtin/command-deck
  version: 1
spec:
  constraints:
    min_members: 2
    max_members: 5
  layout:
    type: split
    direction: horizontal
    children:
      - type: slot
        selector: manager
        weight: 32
        pane_slot: left
      - type: stack
        selector: non-manager
        weight: 68
        direction: vertical
        distribution: equal
        pane_slot_prefix: right
