version: 1
herdr:
  binary: herdr
  compatible_minor: "0.8"
  prompt_timeout_ms: 30000
execution:
  default: dry-run
  retry_unknown_timeout: false
view:
  profile_ref: builtin/command-deck@1
  builtin_profiles: ${CLAUDE_PLUGIN_ROOT}/view-profiles
  manager_ratio: 0.32
state:
  database: ${XDG_STATE_HOME}/agent-fleet/herdr.sqlite3
