name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 自 repository を <workspace>/<自分の名前> に、保守toolの正本 harness-tools と依存 provider を <workspace>/<repo名> に兄弟 checkout する。
      # 兄弟 repository は常に検証済みの main を取得する。PR 由来の ref を依存 checkout へ渡さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/harness-tools
          ref: main
          path: harness-tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - name: Install CLI requirements
        shell: bash
        run: bash harness-tools/ci/install-requirements.sh
      - name: Validate
        shell: bash
        run: bash harness-tools/ci/validate.sh "$GITHUB_WORKSPACE/${{ github.event.repository.name }}"
