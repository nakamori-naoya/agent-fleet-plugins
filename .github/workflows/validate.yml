name: Functional validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 実配布物に対する解決を検査するため、依存 repository を兄弟 checkout として置く。
      # 自 repo は <workspace>/<自分の名前>、依存は <workspace>/<repo名> なので、
      # validate.sh から見た兄弟の相対 path は ../<repo名> になる。
      #
      # 兄弟 repository は常に検証済みの main を取得する。
      # PR 由来の ref を依存 checkout へ渡さず、未信頼のコードを実行する経路を作らない。
      # 複数 repository を同時に更新するときは、提供側から依存順に merge する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'grill-plugins'
        with:
          repository: ${{ github.repository_owner }}/grill-plugins
          ref: main
          path: grill-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'write-doc-plugins'
        with:
          repository: ${{ github.repository_owner }}/write-doc-plugins
          ref: main
          path: write-doc-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'agent-work-policy-plugins'
        with:
          repository: ${{ github.repository_owner }}/agent-work-policy-plugins
          ref: main
          path: agent-work-policy-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'product-planning-plugins'
        with:
          repository: ${{ github.repository_owner }}/product-planning-plugins
          ref: main
          path: product-planning-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'bdd-discovery-and-formulation-plugins'
        with:
          repository: ${{ github.repository_owner }}/bdd-discovery-and-formulation-plugins
          ref: main
          path: bdd-discovery-and-formulation-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'collect-and-digest-plugins'
        with:
          repository: ${{ github.repository_owner }}/collect-and-digest-plugins
          ref: main
          path: collect-and-digest-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.repository.name != 'pull-request-plugins'
        with:
          repository: ${{ github.repository_owner }}/pull-request-plugins
          ref: main
          path: pull-request-plugins
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
      - name: Install CLI requirements
        shell: bash
        run: |
          go install github.com/mikefarah/yq/v4@v4.44.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y jq ripgrep
          else
            brew list jq >/dev/null 2>&1 || brew install jq
            brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          fi
      - name: Validate normal and deliberately broken fixtures
        shell: bash
        working-directory: ${{ github.event.repository.name }}
        run: bash scripts/validate.sh
