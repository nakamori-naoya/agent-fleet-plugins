<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img" aria-labelledby="title desc">
  <title id="title">UserPromptSubmit Hookの分岐</title>
  <desc id="desc">通常prompt、役割同期、通常指示を分け、Core照合の成功時だけモデルへ渡す制御フロー。</desc>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="arrowhead" d="M0 0 L10 5 L0 10z"/></marker>
    <marker id="stopArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="stop-arrowhead" d="M0 0 L10 5 L0 10z"/></marker>
    <style>
      .canvas { fill:#f7f9fc; }
      text { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; fill:#172033; }
      .box { fill:#edf2f8; stroke:#7890ad; stroke-width:2; rx:14; }
      .decision { fill:#fff7e8; stroke:#245f9e; stroke-width:3; }
      .line { fill:none; stroke:#7890ad; stroke-width:3; marker-end:url(#arrow3); }
      .fail { fill:none; stroke:#a64343; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#stopArrow); }
      .arrowhead { fill:#7890ad; }
      .stop-arrowhead, .stop-text { fill:#a64343; }
      .success { fill:#edf2f8; stroke:#287a58; }
      .failure { fill:#edf2f8; stroke:#a64343; }
      .label { font-size:18px; font-weight:700; text-anchor:middle; }
      .small { font-size:16px; fill:#5c6c82; text-anchor:middle; }
      .edge { font-size:16px; fill:#5c6c82; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill:#060c17; }
        text { fill:#e8eef7; }
        .box { fill:#0d1828; stroke:#6f8db4; }
        .decision { fill:#1d2e48; stroke:#82c3ff; }
        .line { stroke:#6f8db4; }
        .fail { stroke:#ff9090; }
        .arrowhead { fill:#6f8db4; }
        .stop-arrowhead, .stop-text { fill:#ff9090; }
        .success { fill:#0d1828; stroke:#64d39a; }
        .failure { fill:#0d1828; stroke:#ff9090; }
        .small, .edge { fill:#a9b9cf; }
      }
    </style>
  </defs>
  <rect class="canvas" width="1280" height="870"/>
  <text x="55" y="48" font-size="27" font-weight="700">promptの種類ごとに必要な検査だけを行う</text>
  <rect class="box" x="490" y="78" width="300" height="70"/><text class="label" x="640" y="120">UserPromptSubmit</text>
  <path class="decision" d="M640 180 L790 245 L640 310 L490 245 Z"/><text class="label" x="640" y="240">Agent Fleet形式か</text><text class="small" x="640" y="266">prefixとJSON契約を確認</text>
  <path class="line" d="M490 245 H270 V365"/><text class="edge" x="350" y="231">いいえ</text>
  <path class="line" d="M790 245 H1010 V365"/><text class="edge" x="890" y="231">はい</text>
  <path class="decision" d="M270 365 L405 425 L270 485 L135 425 Z"/><text class="label" x="270" y="420">艦隊会話か</text><text class="small" x="270" y="446">関連記録を確認</text>
  <path class="decision" d="M1010 365 L1145 425 L1010 485 L875 425 Z"/><text class="label" x="1010" y="420">役割同期か</text><text class="small" x="1010" y="446">指示種別を確認</text>
  <rect class="box" x="70" y="560" width="280" height="90"/><text class="label" x="210" y="598">何も変更せず通過</text><text class="small" x="210" y="627">艦隊外の通常prompt</text>
  <rect class="box" x="410" y="550" width="330" height="110"/><text class="label" x="575" y="590">現在の役割文脈を取得</text><text class="small" x="575" y="620">関連済み通常prompt</text><text class="small" x="575" y="643">Core到達不能なら拒否</text>
  <rect class="box" x="790" y="550" width="260" height="110"/><text class="label" x="920" y="590">一回限りの値を消費</text><text class="small" x="920" y="620">役割同期</text><text class="small" x="920" y="643">会話を関連付け</text>
  <rect class="box" x="1080" y="550" width="170" height="110"/><text class="label" x="1165" y="590">Core照合</text><text class="small" x="1165" y="620">内容・宛先</text><text class="small" x="1165" y="643">受領確定</text>
  <path class="line" d="M205 458 L205 560"/><text class="edge" x="153" y="524">関連なし</text>
  <path class="line" d="M335 458 L500 550"/><text class="edge" x="395" y="500">関連済み</text>
  <path class="line" d="M945 458 L920 550"/><text class="edge" x="850" y="510">役割同期</text>
  <path class="line" d="M1075 458 L1165 550"/><text class="edge" x="1090" y="510">通常指示</text>
  <rect class="success" x="430" y="750" width="420" height="82" rx="16" stroke-width="4"/>
  <text class="label" x="640" y="786">現在の役割文脈とpromptをモデルへ渡す</text><text class="small" x="640" y="812">各経路の検査成功時だけ到達</text>
  <path class="line" d="M210 650 V710 H520 V750"/><path class="line" d="M575 660 V750"/><path class="line" d="M920 660 V710 H760 V750"/><path class="line" d="M1165 660 V710 H820 V750"/>
  <rect class="failure" x="55" y="735" width="255" height="95" rx="16" stroke-width="4"/>
  <text class="label" x="182" y="776">検査失敗</text><text class="small" x="182" y="805">promptを拒否して理由を返す</text>
  <path class="fail" d="M430 605 H365 V782 H310"/><text class="stop-text" x="70" y="700" font-size="16">いずれかの検査に失敗</text>
</svg>
