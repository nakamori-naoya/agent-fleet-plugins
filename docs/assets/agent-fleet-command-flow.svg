<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">managerからworkerへ指示が届く流れ</title>
  <desc id="desc">managerが論理agent IDへ発行したcommandをCoreが記録し、呼び出し側がHerdr adapterへ渡し、adapterが現在のpaneを解決して届けるシーケンス図</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <marker id="return2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f8f62"/>
    </marker>
    <style>
      .title { font:700 28px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172033 }
      .head { font:700 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#172033 }
      .body { font:500 16px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#344054 }
      .small { font:500 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;fill:#5c6c82 }
      .life { stroke:#98a2b3;stroke-width:2;stroke-dasharray:7 7 }
      .send { stroke:#344054;stroke-width:2.5;fill:none;marker-end:url(#arrow2) }
      .return { stroke:#2f8f62;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#return2) }
    </style>
  </defs>
  <rect width="1280" height="790" fill="#f7f9fc"/>
  <text x="64" y="58" class="title">指示はpaneではなく論理agentへ送る</text>
  <text x="64" y="88" class="small">時間は上から下へ進む。緑の破線はworkerによる明示報告。</text>

  <rect x="60" y="120" width="205" height="62" rx="14" fill="#f4ebff" stroke="#9e77ed" stroke-width="2"/>
  <text x="162" y="147" text-anchor="middle" class="head">manager agent</text>
  <text x="162" y="169" text-anchor="middle" class="small">manager-1</text>

  <rect x="320" y="120" width="205" height="62" rx="14" fill="#eaf2fb" stroke="#3974b8" stroke-width="2"/>
  <text x="422" y="147" text-anchor="middle" class="head">Fleet Core</text>
  <text x="422" y="169" text-anchor="middle" class="small">logical state / outbox</text>

  <rect x="580" y="120" width="205" height="62" rx="14" fill="#fff6e5" stroke="#d89b2b" stroke-width="2"/>
  <text x="682" y="147" text-anchor="middle" class="head">呼び出し側</text>
  <text x="682" y="169" text-anchor="middle" class="small">現行MVPの手動bridge</text>

  <rect x="840" y="120" width="205" height="62" rx="14" fill="#eaf8f0" stroke="#2f8f62" stroke-width="2"/>
  <text x="942" y="147" text-anchor="middle" class="head">Herdr adapter</text>
  <text x="942" y="169" text-anchor="middle" class="small">binding / dispatch</text>

  <rect x="1100" y="120" width="120" height="62" rx="14" fill="#edf2f8" stroke="#667085" stroke-width="2"/>
  <text x="1160" y="147" text-anchor="middle" class="head">Herdr</text>
  <text x="1160" y="169" text-anchor="middle" class="small">worker pane</text>

  <line x1="162" y1="182" x2="162" y2="718" class="life"/>
  <line x1="422" y1="182" x2="422" y2="718" class="life"/>
  <line x1="682" y1="182" x2="682" y2="718" class="life"/>
  <line x1="942" y1="182" x2="942" y2="718" class="life"/>
  <line x1="1160" y1="182" x2="1160" y2="718" class="life"/>

  <path d="M162 240 L412 240" class="send"/>
  <text x="287" y="223" text-anchor="middle" class="body">1. task.assign(worker-1)</text>

  <rect x="348" y="270" width="148" height="68" rx="10" fill="#ffffff" stroke="#9fc3e7" stroke-width="2"/>
  <text x="422" y="296" text-anchor="middle" class="body">taskを更新</text>
  <text x="422" y="320" text-anchor="middle" class="body">outboxへ記録</text>

  <path d="M432 375 L672 375" class="send"/>
  <text x="552" y="357" text-anchor="middle" class="body">2. pending commandを読む</text>

  <path d="M692 435 L932 435" class="send"/>
  <text x="812" y="417" text-anchor="middle" class="body">3. Command envelopeを渡す</text>

  <rect x="866" y="465" width="152" height="82" rx="10" fill="#ffffff" stroke="#9bd7b9" stroke-width="2"/>
  <text x="942" y="491" text-anchor="middle" class="body">worker-1を</text>
  <text x="942" y="515" text-anchor="middle" class="body">現在のpaneへ解決</text>
  <text x="942" y="538" text-anchor="middle" class="small">pane IDはここだけ</text>

  <path d="M952 580 L1150 580" class="send"/>
  <text x="1051" y="562" text-anchor="middle" class="body">4. pane get → agent prompt</text>

  <path d="M1150 640 L432 640" class="return"/>
  <text x="791" y="621" text-anchor="middle" class="body">5. worker-1がtask.reportを明示送信</text>
  <text x="791" y="667" text-anchor="middle" class="small">idle / done / prompt成功だけではtask完了にしない</text>

  <rect x="60" y="728" width="1160" height="42" rx="10" fill="#172033"/>
  <text x="640" y="755" text-anchor="middle" style="font:700 17px -apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;fill:#ffffff">
    paneが変わっても、指示とtaskの宛先はworker-1のまま変わらない
  </text>
</svg>
